<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    #dropzone {
      width: 320px;
      height: 180px;
      border: 2px dashed #666;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      user-select: none;
      transition: 0.2s;
    }

    #dropzone.dragover {
      background: #eee;
      border-color: #000;
    }

    #status {
      margin-top: 12px;
      font-size: 14px;
    }

    #uploadBtn {
      margin-top: 12px;
      padding: 10px 16px;
      cursor: pointer;
      display: none; /* 🔴 nascosto inizialmente */
    }

    #progressContainer {
      width: 320px;
      height: 6px;
      background: #ddd;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: green;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>

  <div id="dropzone">
    Clicca o trascina file
  </div>

  <input
    type="file"
    id="fileInput"
    multiple
    accept="image/*,video/*"
    hidden
  />

  <button id="uploadBtn">Carica file</button>

  <div id="status"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <script>
    console.log("UPLOAD SCRIPT LOADED");

    const dropzone = document.getElementById("dropzone");
    const input = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");

    let files = [];

    // =========================
    // OPEN PICKER
    // =========================
    dropzone.addEventListener("click", () => {
      input.click();
    });

    // =========================
    // FILE SELECT
    // =========================
    input.addEventListener("change", (e) => {
      files = Array.from(e.target.files || []);

      if (files.length > 0) {
        status.textContent = `${files.length} file selezionati`;
        uploadBtn.style.display = "block"; // 🔴 mostra bottone
      } else {
        status.textContent = "Nessun file selezionato";
        uploadBtn.style.display = "none";
      }
    });

    // =========================
    // DRAG OVER
    // =========================
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    // =========================
    // DROP
    // =========================
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");

      files = Array.from(e.dataTransfer.files || []);

      if (files.length > 0) {
        status.textContent = `${files.length} file selezionati`;
        uploadBtn.style.display = "block";
      }
    });

    // =========================
    // CONVERT BASE64
    // =========================
    function toBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // =========================
    // UPLOAD
    // =========================
    uploadBtn.addEventListener("click", async () => {

      if (!files.length) {
        status.textContent = "Seleziona file prima";
        return;
      }

      status.textContent = "Upload in corso...";
      progressBar.style.width = "20%";

      try {

        const payload = await Promise.all(files.map(async file => ({
          name: file.name,
          type: file.type,
          data: await toBase64(file)
        })));

        progressBar.style.width = "60%";

        const res = await fetch("https://project-favtv.vercel.app/api/upload", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ files: payload })
        });

        const data = await res.json();

        if (data.success) {
          status.textContent = `Upload completato ✔ (${data.count})`;

          files = [];
          input.value = "";
          uploadBtn.style.display = "none";

          progressBar.style.width = "100%";

          setTimeout(() => {
            progressBar.style.width = "0%";
          }, 800);

        } else {
          status.textContent = "Errore upload";
        }

      } catch (err) {
        console.error(err);
        status.textContent = "Errore connessione";
      }

    });

  </script>

</body>
</html>
