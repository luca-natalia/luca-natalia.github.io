<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
    }

    #dropzone {
      width: 320px;
      height: 180px;
      border: 2px dashed #666;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      transition: 0.2s;
      user-select: none;
    }

    #dropzone.dragover {
      border-color: #000;
      background: #eee;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }

    #progressContainer {
      width: 320px;
      height: 6px;
      background: #ddd;
      border-radius: 5px;
      margin-top: 10px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: green;
      transition: width 0.3s ease;
    }

    button {
      margin-top: 15px;
      padding: 10px 14px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="dropzone">
    Clicca o trascina file
  </div>

  <input
    type="file"
    id="fileInput"
    multiple
    accept="image/*,video/*"
    hidden
  />

  <button id="uploadBtn">Carica file</button>

  <div id="status"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <script>
    console.log("SCRIPT LOADED");

    const dropzone = document.getElementById("dropzone");
    const input = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");

    let files = [];

    // ======================
    // CLICK → FILE PICKER
    // ======================
    dropzone.addEventListener("click", () => {
      console.log("dropzone click");
      input.click();
    });

    uploadBtn.addEventListener("click", () => {
      console.log("button click");
      input.click();
    });

    // ======================
    // FILE SELECTION
    // ======================
    input.addEventListener("change", (e) => {
      files = Array.from(e.target.files || []);
      console.log("files:", files);

      status.textContent = files.length
        ? `${files.length} file selezionati`
        : "Nessun file selezionato";
    });

    // ======================
    // DRAG OVER
    // ======================
    dropzone.addEventListener("dragover", (e) => {
      e.preventDefault();
      dropzone.classList.add("dragover");
    });

    dropzone.addEventListener("dragleave", () => {
      dropzone.classList.remove("dragover");
    });

    // ======================
    // DROP FILES
    // ======================
    dropzone.addEventListener("drop", (e) => {
      e.preventDefault();
      dropzone.classList.remove("dragover");

      files = Array.from(e.dataTransfer.files || []);
      console.log("dropped:", files);

      status.textContent = files.length
        ? `${files.length} file aggiunti`
        : "Nessun file";
    });

    // ======================
    // UPLOAD (verso Vercel)
    // ======================
    uploadBtn.addEventListener("dblclick", async () => {

      if (!files.length) {
        status.textContent = "Seleziona file prima";
        return;
      }

      status.textContent = "Upload in corso...";
      progressBar.style.width = "20%";

      try {

        const payload = await Promise.all(files.map(file => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve({
              name: file.name,
              type: file.type,
              data: reader.result
            });
            reader.readAsDataURL(file);
          });
        }));

        progressBar.style.width = "60%";

        const res = await fetch("https://project-favtv.vercel.app/api/upload", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ files: payload })
        });

        const data = await res.json();

        progressBar.style.width = "100%";

        if (data.success) {
          status.textContent = `Upload completato ✔ (${data.count})`;
          files = [];
          input.value = "";
        } else {
          status.textContent = "Errore upload";
          console.log(data);
        }

        setTimeout(() => {
          progressBar.style.width = "0%";
        }, 800);

      } catch (err) {
        console.error(err);
        status.textContent = "Errore connessione";
      }
    });

  </script>

</body>
</html>
