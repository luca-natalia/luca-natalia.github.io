<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }

    #dropzone {
      width: 320px;
      height: 180px;
      border: 2px dashed #666;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      user-select: none;
    }

    #dropzone:hover {
      border-color: #000;
    }

    #status {
      margin-top: 15px;
      font-size: 14px;
    }

    #progressContainer {
      width: 320px;
      height: 6px;
      background: #ddd;
      margin-top: 10px;
      border-radius: 5px;
      overflow: hidden;
    }

    #progressBar {
      width: 0%;
      height: 100%;
      background: green;
      transition: width 0.3s ease;
    }

    button {
      margin-top: 15px;
      padding: 10px 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div id="dropzone">
    Clicca qui o trascina file
  </div>

  <input
    type="file"
    id="fileInput"
    multiple
    accept="image/*,video/*"
    hidden
  />

  <button id="uploadBtn">Carica file</button>

  <div id="status"></div>

  <div id="progressContainer">
    <div id="progressBar"></div>
  </div>

  <script src="/scripts/main.js"></script>

</body>
</html>
